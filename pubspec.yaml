name: mischiefpingu
description: MischiefPingu - Psiphon & Aether Tunnel Core GUI (Linux & Windows)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  window_manager: ^0.5.2
  path: ^1.9.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_hurt.png
    - assets/images/logo_sad.png
    - assets/images/logo_happy.png
    - assets/images/logo_hi.png
    - assets/sounds/ouch.mp3
    - assets/sounds/sigh.mp3
    - assets/sounds/happy.mp3
