name: Build mischiefpingu Desktop Apps

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*.*.*'
      - 'v*.*.*'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      version:
        description: 'Version (مثلاً 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libayatana-appindicator3-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            fuse \
            libfuse2 \
            file \
            wget

      - name: Verify GStreamer
        run: |
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --variable pc_path pkg-config
          test -f /usr/lib/x86_64-linux-gnu/pkgconfig/gstreamer-1.0.pc
          pkg-config --exists gstreamer-1.0
          pkg-config --modversion gstreamer-1.0
          pkg-config --cflags gstreamer-1.0
          pkg-config --libs gstreamer-1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Copy bundled binaries & data (Linux)
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          PLATFORM_DIR="$BUNDLE_DIR/linux"

          mkdir -p "$PLATFORM_DIR"

          if [ -d "bundled/linux" ]; then
            echo "→ Copying bundled/linux → $PLATFORM_DIR"
            cp -a bundled/linux/. "$PLATFORM_DIR/"
          else
            echo "⚠ Warning: bundled/linux not found — skipping platform binaries"
          fi

          for f in server_list.dat geoip geoip6; do
            if [ -f "bundled/linux/$f" ]; then
              cp -f "bundled/linux/$f" "$BUNDLE_DIR/"
              echo "→ Copied $f next to binary"
            elif [ -f "bundled/$f" ]; then
              cp -f "bundled/$f" "$BUNDLE_DIR/"
              echo "→ Copied $f next to binary (from bundled/)"
            fi
          done

          echo "── Sizes of key files ──"
          ls -lh "$PLATFORM_DIR"/aether "$PLATFORM_DIR"/psiphon-tunnel-core "$PLATFORM_DIR"/sstp-proxy 2>/dev/null || true
          ls -lh "$BUNDLE_DIR"/server_list.dat 2>/dev/null || true

          echo "── Contents of bundle after copy ──"
          ls -la "$BUNDLE_DIR"
          echo "── Contents of platform dir ──"
          ls -la "$PLATFORM_DIR" || true

      - name: Package Linux bundle (zip)
        run: |
          cd build/linux/x64/release
          zip -r ../../../../mischiefpingu-linux-x64.zip bundle
          cd ../../../..
          ls -lh mischiefpingu-linux-x64.zip

      - name: Build Linux AppImage
        run: |
          set -e

          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"
          APP_NAME="mischiefpingu"
          BINARY_NAME="mischiefpingu"   # نام باینری داخل bundle (معمولاً همان نام پکیج)

          # پیدا کردن نام واقعی باینری اگر متفاوت بود
          if [ ! -f "$BUNDLE_DIR/$BINARY_NAME" ]; then
            BINARY_NAME=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -executable ! -name "*.so*" | head -n1 | xargs -r basename)
            echo "→ Detected binary name: $BINARY_NAME"
          fi

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$APPDIR/usr/share/metainfo"

          # کپی کل bundle داخل AppDir
          cp -a "$BUNDLE_DIR"/. "$APPDIR/usr/bin/"

          # AppRun
          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/mischiefpingu" "$@"
          EOF
          # اگر نام باینری فرق داشت، اصلاح می‌کنیم
          sed -i "s|mischiefpingu|${BINARY_NAME}|g" "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # .desktop
          cat > "$APPDIR/usr/share/applications/${APP_NAME}.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=MischiefPingu
          Comment=Multi-core proxy client (Psiphon, Aether, Tor, SSTP, WireGuard)
          Exec=${BINARY_NAME}
          Icon=${APP_NAME}
          Categories=Network;Utility;
          Terminal=false
          StartupNotify=true
          EOF

          # لینک desktop به ریشه AppDir (الزامی برای appimagetool)
          ln -sf "usr/share/applications/${APP_NAME}.desktop" "$APPDIR/${APP_NAME}.desktop"

          # آیکون
          if [ -f "assets/images/logo.png" ]; then
            cp assets/images/logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
            ln -sf "usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png" "$APPDIR/${APP_NAME}.png"
            ln -sf "${APP_NAME}.png" "$APPDIR/.DirIcon"
          else
            echo "⚠ logo.png not found — AppImage will have no icon"
          fi

          # دانلود appimagetool
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          # در محیط CI معمولاً FUSE در دسترس نیست → extract می‌کنیم
          ./appimagetool --appimage-extract
          APPIMAGETOOL="./squashfs-root/AppRun"

          export ARCH=x86_64
          export VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == refs/* ]] || [ -z "$VERSION" ] || [[ "$VERSION" == "main" ]] || [[ "$VERSION" == "master" ]]; then
            VERSION="continuous"
          fi

          $APPIMAGETOOL --no-appstream "$APPDIR" "mischiefpingu-linux-x86_64.AppImage"

          chmod +x mischiefpingu-linux-x86_64.AppImage
          ls -lh mischiefpingu-linux-x86_64.AppImage
          file mischiefpingu-linux-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mischiefpingu-linux-x64
          path: |
            mischiefpingu-linux-x64.zip
            mischiefpingu-linux-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Git LFS files
        shell: pwsh
        run: git lfs pull

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Copy bundled binaries & data (Windows)
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          $PlatformDir = Join-Path $ReleaseDir "windows"

          New-Item -ItemType Directory -Force -Path $PlatformDir | Out-Null

          if (Test-Path "bundled/windows") {
            Write-Host "→ Copying bundled/windows → $PlatformDir"
            Copy-Item -Path "bundled/windows\*" -Destination $PlatformDir -Recurse -Force
          } else {
            Write-Host "⚠ Warning: bundled/windows not found — skipping platform binaries"
          }

          $sharedFiles = @("server_list.dat", "geoip", "geoip6")
          foreach ($f in $sharedFiles) {
            $src1 = "bundled/windows/$f"
            $src2 = "bundled/$f"
            if (Test-Path $src1) {
              Copy-Item -Path $src1 -Destination $ReleaseDir -Force
              Write-Host "→ Copied $f next to binary"
            } elseif (Test-Path $src2) {
              Copy-Item -Path $src2 -Destination $ReleaseDir -Force
              Write-Host "→ Copied $f next to binary (from bundled/)"
            }
          }

          Write-Host "── Sizes of key files ──"
          Get-ChildItem $PlatformDir -File | Select-Object Name, Length | Format-Table -AutoSize
          if (Test-Path (Join-Path $ReleaseDir "server_list.dat")) {
            Get-Item (Join-Path $ReleaseDir "server_list.dat") | Select-Object Name, Length
          }

          Write-Host "── Contents of Release after copy ──"
          Get-ChildItem $ReleaseDir | Format-Table Name, Length
          Write-Host "── Contents of platform dir ──"
          if (Test-Path $PlatformDir) {
            Get-ChildItem $PlatformDir | Format-Table Name, Length
          }

      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "mischiefpingu-windows-x64.zip" `
            -Force
          Get-Item "mischiefpingu-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mischiefpingu-windows-x64
          path: mischiefpingu-windows-x64.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mischiefpingu-*
          path
