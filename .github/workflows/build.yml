      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libayatana-appindicator3-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

          echo "Installed GStreamer pkg-config files:"
          dpkg -L libgstreamer1.0-dev | grep '\.pc$' || true
          dpkg -L libgstreamer-plugins-base1.0-dev | grep '\.pc$' || true

          echo "pkg-config search paths:"
          pkg-config --variable pc_path pkg-config

          echo "GStreamer version:"
          pkg-config --modversion gstreamer-1.0

          echo "GStreamer compile flags:"
          pkg-config --cflags gstreamer-1.0

          echo "GStreamer linker flags:"
          pkg-config --libs gstreamer-1.0
